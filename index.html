<!doctype html>
<html lang="en">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Card game</title>
      <link rel="stylesheet" href="style.css" />
   </head>
   <body>
      <div class="main-container row justify-center align-center padding-1">
         <div class="left-side margin-1">
            <div class="actions">actions</div>
         </div>
         <div class="board column justify-evenly">
            <div class="lanes column justify-evenly">
               <div class="lane-enemy row justify-evenly align-center">
                  <div class="card-enemy">Enemy Card 1</div>
                  <div class="card-enemy">Enemy Card 2</div>
                  <div class="card-enemy">Enemy Card 3</div>
                  <div class="card-enemy">Enemy Card 4</div>
               </div>
               <div class="lane-player row justify-evenly align-center">
                  <div class="card-player">Player Card 1</div>
                  <div class="card-player">Player Card 2</div>
                  <div class="card-player">Player Card 3</div>
                  <div class="card-player">Player Card 4</div>
               </div>
            </div>
            <div class="player-hand row justify-evenly align-center">
                  <div class="card-player-hand">Player Hand 1</div>
                  <div class="card-player-hand">Player Hand 2</div>
                  <div class="card-player-hand">Player Hand 3</div>
                  <div class="card-player-hand">Player Hand 4</div>
               </div>
         </div>
         <div class="right-side margin-1">
            <div class="player-deck">player-deck</div>
         </div>
      </div>
   </body>
</html>
