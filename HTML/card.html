<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Card</title>
    <link rel="stylesheet" href="../CSS/cards.css" />
  </head>
  <body>
    <div class="card">
      <div class="cardHeader">
        <span class="cardName">Basic Card Name</span>
        <span class="cardCost">1</span>
      </div>

      <div class="card-portraitBox">
        <img
          class="card-portrait"
          src="../Assets/CardPortraits/PlaceholderPortrait.png"
          alt="Art for the Card"
        />
      </div>

      <div class="cardspecialsBox">
        <div class="cardSpecials">Special Rule</div>
      </div>

      <div class="card-stats">
        <div class="cardAtk">1</div>
        <div class="cardHP">1</div>
      </div>
    </div>
  </body>
</html>
